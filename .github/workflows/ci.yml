name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orders_test
          POSTGRES_USER: orders_test
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U orders_test -d orders_test"
          --health-interval=3s --health-timeout=3s --health-retries=20
    env:
      POSTGRES_DB: orders_test
      POSTGRES_USER: orders_test
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      JWT_SECRET: isolated-tests-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head && alembic check
      - run: pytest -q --cov=app --cov-report=term-missing
      - run: alembic downgrade base && alembic upgrade head && alembic check
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: curl --fail http://localhost:8000/health && curl --fail --output /dev/null http://localhost:8000/openapi.json
      - if: always()
        run: docker compose logs && docker compose down
